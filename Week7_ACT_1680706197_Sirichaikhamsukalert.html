<!doctype html>
<html>
  <head>
    <title>Form Validation</title>
    <meta charset="UTF-8" />

    <style>
      .error-input {
        border-color: red;
        background-color: azure;
      }

      .error-text {
        color: red;
        display: none;
      }
    </style>
  </head>

  <body>
    <h3>Form Validation</h3>
    <input type="text" id="some_input" />
    <br /><br />
    <button id="calculate_btn">Calculate</button>
    <script>
      const calculateBtn = document.querySelector("#calculate_btn");
      calculateBtn.addEventListener("click", () => {
        alert("Answer is 67");
      });
      const someInput = document.querySelector("#some_input");

      someInput.addEventListener("keydown", (e) => {
        console.log(`Key pressed: ${e.key}`);
      });

      document.addEventListener("keydown", (e) => {
        console.log(`Key pressed: ${e.key}`);
      });
      function onTaskSuccess(data) {
        console.log("Task complete " + data);
      }
      function onTaskError(errorLog) {
        console.log("Task error " + errorLog);
      }

      function doSomething(onSuccess, onError) {
        let isSuccess = false;

        if (isSuccess) {
          onSuccess("Name is Arm");
        } else {
          onError("Data cannot found");
        }
      }
      doSomething(onTaskSuccess, onTaskError);
    </script>
    <hr />
    <form name="registration" onsubmit="return validateForm();">
      Student ID:
      <br />
      <input type="text" name="student_id" />
      <br />
      <span class="error-text" id="student_id_error"> This is an error </span>
      <br /><br />
      <button>Submit</button>
    </form>

    <script>
      const studentIdEl = document.forms["registration"]["student_id"];
      studentIdEl.addEventListener("blur", () => {
        console.log("Student ID input lost focus");
      });

      function validateForm() {
        const targetForm = document.forms["registration"];
        const studentIdError = document.querySelector("#student_id_error");
        const studentIdEl = targetForm["student_id"];
        const studentId = studentIdEl.value;

        if (studentId == "") {
          alert("Student ID cannot be empty");
          studentIdEl.classList.add("error-input");
          studentIdError.style.display = "inline";
          studentIdError.textContent = "Student ID cannot be empty";

          return false;
        } else if (studentId.length != 10) {
          alert("Student ID must have length 10 ");
          studentIdEl.classList.add("error-input");
          studentIdError.style.display = "inline";
          studentIdError.textContent = "Student ID must have 10 characters";

          return false;
        }

        studentIdEl.classList.remove("error-input");
        studentIdError.style.display = "none";
        return true;
      }
      function applyError(targetEl, targetError, errorMessage) {
        alert(errorMessage);
        targetEl.classList.add("error-input");
        targetError.style.display = "inline";
        targetError.textContent = errorMessage;
      }
    </script>
  </body>
</html>
